schemaVersion: 1
apps:
  - id: nginx
    title: Nginx
    version: "1.30.5"
    description: 高性能 HTTP 服务器与反向代理服务器
    tags:
      - 网络
      - Web
      - 反向代理
    image: "nginx:1.30.5-alpine"
    d: true
    rm: false
    restart: unless-stopped
    ports:
      - port: 8080
        target: 80
        desc: 默认端口

  - id: gallery-dl
    title: gallery-dl
    version: "1.32.19"
    description: 支持多个图片与媒体站点的命令行下载工具
    tags:
      - 下载
      - 图片
      - 媒体
    image: "ghcr.io/mikf/gallery-dl:v1.32.19"
    d: false
    rm: true
    restart: "no"
    inputs:
      - id: url
        title: 下载地址
        required: true
        placeholder: "https://example.com/album"
    command:
      - --directory
      - /gallery-dl
      - "{{url}}"
    volumes:
      - target: /gallery-dl
        type: dir
        desc: 下载目录
        required: true
